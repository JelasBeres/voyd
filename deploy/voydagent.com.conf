# nginx · voydagent.com → VOYD (site + Ask the voyd chat) on 127.0.0.1:5080
# Installed to /etc/nginx/conf.d/voydagent.com.conf; certbot adds the 443 block.
server {
    listen 80;
    listen [::]:80;
    server_name voydagent.com www.voydagent.com;

    client_max_body_size 13m;

    location / {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /api/ask streams the answer as it is written
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
